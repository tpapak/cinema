# CINeMA Production Stack
# Usage (from docker/ directory):
#   docker compose build
#   docker compose up -d
#
# Frontend: nginx on port 8080 (host nginx proxies here)
# Backend:  Flask+R on port 8004 (internal, proxied by container nginx)
#
# External nginx (TLS) on host → localhost:8080 → cinema-web → cinema-api

services:
  cinema-web:
    build:
      context: ..
      dockerfile: docker/cinema-web/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - cinema-api
    restart: unless-stopped

  cinema-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    expose:
      - "8004"
    environment:
      - FLASK_DEBUG=0
      - MAX_R_JOBS=1
      - R_QUEUE_LIMIT=5
      - R_TIMEOUT=300
      # R_MEMORY_LIMIT_MB enforces RLIMIT_AS (virtual address space) per R process.
      # That is the WRONG metric: igraph/netcontrib reserve large virtual regions that
      # never touch physical RAM, so a low cap spuriously fails analyses that fit in RAM
      # (e.g. ~14-treatment networks). Disabled — the container mem_limit below is the
      # real (RSS/cgroup) ceiling and protects the host. Re-enable only as a high backstop.
      # - R_MEMORY_LIMIT_MB=1536
      # - R_MEMORY_LIMIT_MB=1024
    # mem_limit: 2g
    mem_limit: 1536m
    pids_limit: 256
    restart: unless-stopped
