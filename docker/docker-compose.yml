# CINeMA Production Stack
# Usage (from docker/ directory):
#   docker compose build
#   docker compose up -d
#
# Frontend: nginx on port 80
# Backend:  Flask+R on port 8004 (internal, proxied by nginx)

services:
  cinema-web:
    build:
      context: ..
      dockerfile: docker/cinema-web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - cinema-api
    restart: unless-stopped

  cinema-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    expose:
      - "8004"
    environment:
      - FLASK_DEBUG=0
    restart: unless-stopped
